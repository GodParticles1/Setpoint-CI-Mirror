name: Projection Digest Prep

on:
  push:
    branches:
      - ci/hotfix-67f3541-mirror-prep

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 49f12e1fc99bccb55d56ea4301d45cd49ba40cc4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ci/hotfix-67f3541-mirror-prep
      - name: Wait for exact public mirror CI and publish result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESULT=.public-mirror/public-ci-result.txt
          if [ -f "$RESULT" ] && grep -q "PUBLIC_CI_SHA=$TARGET_SHA" "$RESULT"; then
            echo "result already published"
            exit 0
          fi
          run_id=""
          conclusion=""
          for i in $(seq 1 90); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/public-ci.yml/runs?head_sha=${TARGET_SHA}&event=push&per_page=10")"
            run_id="$(printf '%s' "$payload" | jq -r '.workflow_runs[0].id // empty')"
            status="$(printf '%s' "$payload" | jq -r '.workflow_runs[0].status // empty')"
            conclusion="$(printf '%s' "$payload" | jq -r '.workflow_runs[0].conclusion // empty')"
            echo "poll=$i run_id=$run_id status=$status conclusion=$conclusion"
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "PUBLIC_CI_MONITOR=NO_RUN" >&2
            exit 1
          fi
          if [ "$status" != "completed" ]; then
            echo "PUBLIC_CI_MONITOR=TIMEOUT" >&2
            exit 1
          fi
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          {
            echo "PUBLIC_CI_SHA=$TARGET_SHA"
            echo "PUBLIC_CI_RUN_ID=$run_id"
            echo "PUBLIC_CI_CONCLUSION=$conclusion"
            printf '%s' "$jobs" | jq -r '.jobs[] | "JOB=" + .name + " CONCLUSION=" + (.conclusion // "")'
          } > "$RESULT"
          cat "$RESULT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT"
          git diff --cached --quiet && exit 0
          git commit -m 'ci: publish checks hotfix public CI result'
          git push origin HEAD:ci/hotfix-67f3541-mirror-prep
