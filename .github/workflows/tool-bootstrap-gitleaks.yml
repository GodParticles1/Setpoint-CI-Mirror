name: Tool Bootstrap - Gitleaks

on:
  push:
    branches:
      - ci/hotfix-67f3541-mirror-prep

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify official Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="/tmp/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Upload verified Gitleaks binary
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-linux-x64-v8.30.1
          path: /tmp/gitleaks
          if-no-files-found: error
          retention-days: 1
